<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About — The New Japonisme</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000; /* Pure black background */
            --text-color: #eeeeee; /* Soft white text */
            --muted-text: #a0a0a0; /* Muted grey for descriptions */
            --accent-color: #9e2a2b; /* Elegant Japanese crimson */
            --border-color: #1a1a1a; /* Dark grey borders */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        /* Header & Navigation */
        header {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px 20px 20px;
            text-align: center;
        }

        .logo {
            font-size: 3.3rem; 
            font-weight: 700; 
            letter-spacing: 3.6px; 
            text-transform: uppercase;
            margin-bottom: 30px;
            display: inline-block;
            text-decoration: none;
            color: var(--text-color);
        }

        .logo-text-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 15px; 
        }

        .logo span {
            color: var(--text-color); 
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background-color: var(--accent-color); 
            border-radius: 50%;
            flex-shrink: 0;
        }

        nav {
            margin-bottom: 60px;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 18px 0;
        }

        nav a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 25px;
            font-weight: 400;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        /* About Page Content */
        main {
            max-width: 1000px; /* Slightly wider to accommodate image */
            margin: 0 auto;
