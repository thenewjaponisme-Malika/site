<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The New Japonisme</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000; /* Pure black background */
            --text-color: #eeeeee; /* Soft white text */
            --accent-color: #9e2a2b; /* Elegant Japanese crimson */
            --border-color: #222222; /* Dark grey borders */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Now using Poppins as the primary font */
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Header & Navigation */
        header {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px 20px 20px; /* Increased padding */
            text-align: center;
        }

        .logo {
            /* +50% Size, Extra-Bold (700), Poppins font */
            font-size: 3.3rem; /* (Was 2.2rem * 1.5 = 3.3rem) */
            font-weight: 700; /* Bolder for impact */
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 30px;
            display: inline-block;
            text-decoration: none;
            color: var(--text-color);
            position: relative;
        }

        .logo-text-wrapper {
            display: inline-flex;
            align-items: center;
        }

        .logo span {
            color: var(--accent-color);
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background-color: #D32F2F; /* Crimson from icon image_5.png */
            border-radius: 50%;
            margin-right: 15px; /* Space between icon and text */
            flex-shrink: 0;
        }

        nav {
            margin-bottom: 40px;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 18px 0;
        }

        nav a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 25px;
            font-weight: 400;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        /* Main Feed (Strict 3-in-a-row Grid) */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 80px 20px;
        }

        .feed-grid {
            display: grid;
            /* Explicitly setting strict 3 columns on large screens */
            grid-template-columns: repeat(3, 1fr);
            gap: 15px; /* Smaller gap for tighter Instagram look */
        }

        .feed-item {
            background: #111; /* Slightly lighter than pure black */
            text-decoration: none;
            color: var(--text-color);
            display: block;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease;
        }

        /* Image Container for Square Instagram Look */
        .image-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%; /* Perfect 1:1 Square */
            overflow: hidden;
            background-color: #1a1a1a;
        }

        .image-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .feed-item:hover .image-wrapper img {
            transform: scale(1.03); /* Subtle zoom effect */
        }

        /* Text overlay/caption underneath the image */
        .item-caption {
            padding: 20px;
            background: #111; /* Slightly lighter than pure black */
        }

        .item-category {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-color);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .item-title {
            font-size: 1.05rem;
            font-weight: 300; /* Lighter weight for titles on black */
            line-height: 1.4;
            letter-spacing: -0.1px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 0.75rem;
            color: #666; /* Darker text in footer */
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            letter-spacing: 1.5px;
        }

        /* Mobile Optimization */
        @media (max-width: 1024px) {
            /* 2 columns on tablets */
            .feed-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .logo {
                font-size: 2.8rem; /* Scale down slightly on tablets */
            }
            .logo-icon {
                width: 38px;
                height: 38px;
                margin-right: 12px;
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 40px 20px 10px 20px;
            }
            nav {
                padding: 12px 0;
            }
            nav a {
                margin: 0 10px;
                font-size: 0.7rem;
                letter-spacing: 1px;
            }
            .feed-grid {
                grid-template-columns: 1fr; /* Single column on mobile like Insta feed */
                gap: 10px;
            }
            .logo {
                font-size: 2.2rem; /* Scale down more on mobile */
                letter-spacing: 3px;
            }
            .logo-icon {
                width: 28px;
                height: 28px;
                margin-right: 10px;
            }
            .item-title {
                font-size: 0.95rem;
            }
        }
    </style>
</head>

        </a>
        <nav>
            <a href="/">Home</a>
            <a href="/articles.html">Articles</a>
            <a href="/about.html">About</a>
            <a href="/instagram.html">Instagram</a>
        </nav>
    </header>
