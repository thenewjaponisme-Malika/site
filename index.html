<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The New Japonisme</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000; /* Pure black background */
            --text-color: #eeeeee; /* Soft white text */
            --muted-text: #a0a0a0; /* Muted grey for descriptions */
            --accent-color: #9e2a2b; /* Elegant Japanese crimson */
            --border-color: #1a1a1a; /* Dark grey borders */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Header & Navigation */
        header {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px 20px 20px;
            text-align: center;
        }

        .logo {
            font-size: 3.3rem; 
            font-weight: 700; 
            letter-spacing: 3.6px; 
            text-transform: uppercase;
            margin-bottom: 30px;
            display: inline-block;
            text-decoration: none;
            color: var(--text-color);
        }

        .logo-text-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 15px; 
        }

        .logo span {
            color: var(--text-color); 
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background-color: var(--accent-color); 
            border-radius: 50%;
            flex-shrink: 0;
        }

        nav {
            margin-bottom: 40px;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 18px 0;
        }

        nav a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 25px;
            font-weight: 400;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        /* Manifesto Intro Section */
        .intro-manifesto {
            max-width: 800px;
            margin: 0 auto 60px auto;
            text-align: center;
            padding: 0 20px;
        }

        .intro-question {
            font-size: 1.3rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            color: var(--text-color);
            margin-bottom: 15px;
        }

        .intro-description {
            font-size: 0.95rem;
            font-weight: 300;
            color: var(--muted-text);
            max-width: 700px;
            margin: 0 auto;
        }

        /* Main Content Container */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 40px 20px;
        }

        /* Category Section Styling */
        .category-section {
            margin-bottom: 60px;
        }

        .category-heading {
            font-size: 1.4rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-color);
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
        }

        .category-heading::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: var(--accent-color);
            border-radius: 50%;
            margin-right: 12px;
        }

        /* Instagram-style 3-in-a-row Grid */
        .feed-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px; 
        }

        .feed-item {
            background: #0a0a0a;
            text-decoration: none;
            color: var(--text-color);
            display: block;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%; 
            overflow: hidden;
            background-color: #111;
        }

        .image-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .feed-item:hover .image-wrapper img {
            transform: scale(1.03);
        }

        .item-caption {
            padding: 20px;
            background: #050505;
        }

        .item-title {
            font-size: 1rem;
            font-weight: 300;
            line-height: 1.4;
            letter-spacing: -0.1px;
        }

        /* Contact Us Section Box */
        .contact-section {
            max-width: 1200px;
            margin: 40px auto 40px auto;
            padding: 50px 20px;
            background: #050505;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .contact-title {
            font-size: 1.4rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
            color: var(--text-color);
        }

        .contact-text {
            font-size: 0.95rem;
            font-weight: 300;
            color: var(--muted-text);
            max-width: 600px;
            margin: 0 auto 30px auto;
        }

        .contact-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .contact-link-item {
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid var(--border-color);
            padding: 12px 30px;
            transition: all 0.3s ease;
        }

        .contact-link-item:hover {
            border-color: var(--text-color);
            color: var(--accent-color);
            transform: translateY(-2px);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 0.75rem;
            color: #444;
            border-top: 1px solid var(--border-color);
            letter-spacing: 1.5px;
        }

        /* Responsive Optimization */
        @media (max-width: 1024px) {
            .feed-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .logo {
                font-size: 2.8rem;
                letter-spacing: 3px;
            }
            .logo-icon {
                width: 38px;
                height: 38px;
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 40px 15px 10px 15px;
            }
            nav {
                padding: 12px 0;
                margin-bottom: 30px;
            }
            nav a {
                margin: 0 6px;
                font-size: 0.65rem;
                letter-spacing: 1px;
            }
            .intro-manifesto {
                margin-bottom: 40px;
            }
            .intro-question {
                font-size: 1.1rem;
            }
            .intro-description {
                font-size: 0.85rem;
            }
            .feed-grid {
                grid-template-columns: 1fr; 
                gap: 15px;
            }
            
            /* Strict One-Line Rules for Logo on Mobile Screens */
            .logo {
                font-size: 5.2vw; /* Dynamically sizes text to fit smaller screens perfectly */
                letter-spacing: 1
