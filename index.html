<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The New Japonisme</title>
    <style>
        body {
            background-color: #fcfbf9; /* Soft cream background */
            color: #2b2b2b; /* Deep charcoal text */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding-top: 10vh;
        }
        h1 {
            color: #9e2a2b; /* Elegant Japanese crimson */
            font-size: 42px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        h1 span {
            font-weight: 600;
        }
        p {
            font-size: 18px;
            color: #666;
            line-height: 1.6;
            font-style: italic;
        }
        .divider {
            width: 50px;
            height: 2px;
            background-color: #e0dacb;
            margin: 30px auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>The New <span>Japonisme</span></h1>
        <div class="divider"></div>
        <p>Welcome. Our new platform exploring Japanese art, history, and aesthetics is currently under development and will launch shortly.</p>
    </div>
</body>
</html>
